name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and format check
        run: npx biome ci .
      - name: Astro and TypeScript check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Content guard
        run: npm run content:guard
      - name: Build
        run: npm run build
